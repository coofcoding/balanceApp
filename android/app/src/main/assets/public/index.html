<!DOCTYPE html>
<html lang="es">
<head>

<title>Mi presupuesto</title>
<script src="chart.umd.js"></script>
<style>
:root{--bg:#fffdfb;--b1:#ffe9d6;--b2:#fff3e8;--gl:rgba(255,255,255,.72);--gl2:rgba(255,255,255,.9);--bd:rgba(255,255,255,.9);--bd2:rgba(249,115,22,.10);--inbg:rgba(255,255,255,.7);--tx:#2a1a0e;--mu:#8a7360;--pr:#ea580c;--ok:#15803d;--bad:#e11d48;--sh:0 8px 32px rgba(120,60,20,.08);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
body{font-family:-apple-system,"SF Pro Display",Inter,system-ui,Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";color:var(--tx);background:radial-gradient(60% 38% at 8% 0,var(--b1),transparent 70%),radial-gradient(50% 36% at 100% 22%,var(--b2),transparent 70%),var(--bg);background-attachment:fixed}
#app{max-width:640px;margin:0 auto;padding:62px 16px 130px}
h1{font-size:28px;margin:8px 2px 4px;letter-spacing:-.02em}
h2{font-size:14px;color:var(--mu);font-weight:600;margin:22px 4px 8px}
small{color:var(--mu);font-size:12px}
.g{background:var(--gl);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh)}
.pad{padding:14px}
.hero{padding:20px;margin-bottom:12px}
.hero.pu{background:linear-gradient(135deg,#f97316,#fdba74);color:#fff;border:0}
.hero.pu small{color:rgba(255,255,255,.8)}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:14px}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 16px}
.ring{position:relative;aspect-ratio:1;width:100%;max-width:170px;margin:0 auto;border-radius:50%!important}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12%}
.ring b{font-size:clamp(12px,3.7vw,17px);letter-spacing:-.02em;white-space:nowrap;margin-top:2px}
.tile b{display:block;font-size:20px;margin-top:4px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.sav{color:var(--pr)}
.seg{display:flex;background:var(--inbg);border:1px solid var(--bd2);border-radius:14px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:11px;font:inherit;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--gl2);color:var(--pr);font-weight:600;box-shadow:0 1px 6px rgba(0,0,0,.1)}
.in{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--bd2);background:var(--inbg);color:var(--tx);font:inherit;box-sizing:border-box;margin-bottom:10px;min-height:46px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0}

.chips button.on,.chip.on{background:var(--gl2);color:var(--pr);border-color:var(--pr);font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd2)}
.row:last-child{border:0}
.ico{width:38px;height:38px;border-radius:12px;background:var(--inbg);display:grid;place-items:center;font-size:18px;flex:none}
.mid{flex:1;min-width:0}
.mid b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;font-size:15px;white-space:nowrap}
.x{border:0;background:none;color:var(--mu);font:inherit;font-size:13px;cursor:pointer;padding:6px}
.trk{height:8px;border-radius:99px;background:var(--trk);overflow:hidden;margin:6px 0}
.trk i{display:block;height:100%;border-radius:99px;background:var(--pr)}
.cb{margin-bottom:14px}.cb:last-child{margin:0}
.cbh{display:flex;justify-content:space-between}
.cv{position:relative;height:300px}
.empty{text-align:center;color:var(--mu);padding:20px 0}
.lnk{background:none;border:0;color:var(--pr);font:inherit;font-weight:600;cursor:pointer;margin-top:8px}
.flt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flt .in:last-child{grid-column:1/-1}
nav{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:20;pointer-events:none}
nav .bar{pointer-events:auto;width:100%;max-width:520px;display:flex;justify-content:space-around;align-items:center;padding:8px 6px}
nav button.t{background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:10px;padding:6px 1px;flex:1;cursor:pointer}
nav button.t.on{color:var(--pr);font-weight:600}
.fab{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--pr),var(--p2));color:#fff;border:0;box-shadow:0 8px 20px color-mix(in srgb,var(--pr) 40%,transparent);display:grid;place-items:center;margin-top:-24px;cursor:pointer}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sh{position:fixed;inset:0;z-index:40;display:none}
#sh.on{display:flex;align-items:center;justify-content:center;padding:20px}
.bk{position:absolute;inset:0;background:rgba(30,10,60,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.pan{position:relative;width:100%;max-width:440px;border-radius:28px;padding:18px;max-height:100%;overflow:auto;box-sizing:border-box;background:var(--gl2)}
.pan .chips{flex-wrap:wrap;overflow:visible}
label{display:block;font-size:12px;color:var(--mu);margin:12px 2px 6px}
.save{width:100%;margin-top:16px;padding:14px;border:0;border-radius:16px;background:var(--pr);color:#fff;font:inherit;font-weight:600;font-size:16px;cursor:pointer}
button:focus-visible,.in:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
:root{--e:cubic-bezier(.32,.72,0,1)}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes sheet{from{transform:translateY(100%)}}
@keyframes push{from{opacity:0;transform:translateX(32px)}}
@keyframes ring{from{stroke-dasharray:0 276.46}}
@keyframes sx{from{transform:scaleX(0)}}
#app.a>*{animation:up .6s var(--e) both}
#app.a>*:nth-child(2){animation-delay:.05s}#app.a>*:nth-child(3){animation-delay:.1s}#app.a>*:nth-child(4){animation-delay:.15s}#app.a>*:nth-child(n+5){animation-delay:.2s}
.ring circle+circle{animation:ring 1.1s var(--e) both}
.trk i,.stk i{transform-origin:left;animation:sx .9s var(--e) both}
button{transition:transform .25s var(--e),background .25s,color .25s,box-shadow .25s}
button:active{transform:scale(.95)}
.bk{animation:fade .3s ease}.pan{animation:pop .45s var(--e)}
.row.tap{cursor:pointer;transition:background .2s}.row.tap:active{background:var(--inbg)}
#dt{position:fixed;inset:0;z-index:30;display:none;overflow:auto;background:radial-gradient(60% 38% at 8% 0,var(--b1),transparent 70%),var(--bg)}
#dt.on{display:block;animation:push .45s var(--e)}
.dtp{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.dtp .two{margin-top:12px}
.dtt{display:flex;justify-content:space-between;align-items:center}
.back{font-size:16px!important;color:var(--pr)!important;padding:8px 0!important}
.stk{display:flex;gap:2px;height:10px;margin:10px 0;border-radius:99px;overflow:hidden}.stk i{display:block;height:100%}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.tag{color:var(--pr)!important;font-weight:600}
.chev{color:var(--mu);font-size:22px}
.ck{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:15px;color:var(--tx)}.ck input{width:22px;height:22px;accent-color:var(--pr)}
.pan .seg button{font-size:13px;padding:9px 4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.gear{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;border-radius:50%!important;display:grid;place-items:center;color:var(--tx);cursor:pointer;z-index:15;padding:0}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;margin:14px 0 4px;border-radius:16px;background:var(--inbg);border:1px solid var(--bd2);font-size:15px;color:var(--tx);cursor:pointer}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{flex:none;width:50px;height:30px;border-radius:99px;background:rgba(120,120,128,.3);position:relative;transition:background .3s var(--e)}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .35s var(--e)}
.sw input:checked+i{background:var(--pr)}
.sw input:checked+i:after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--pr);outline-offset:2px}
.swt{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.swt button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--gl2);cursor:pointer;padding:0}
.swt button.on{border-color:var(--tx)}
.swt input{width:34px;height:34px;border:0;padding:0;background:none;border-radius:50%;overflow:hidden;cursor:pointer}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tg small{display:block;margin:0 0 4px 2px}
.dtb{text-align:left;cursor:pointer;text-transform:capitalize}
#cal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
#cal.on{display:flex}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.cpn{position:relative;width:100%;max-width:340px;padding:16px;background:var(--gl2);animation:pop .4s var(--e)}
.chd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;text-transform:capitalize}
.chd button{width:36px;height:36px;border-radius:50%;border:0;background:var(--inbg);color:var(--tx);font-size:20px;cursor:pointer}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cg b{font-size:12px;color:var(--mu);padding:6px 0;font-weight:600}
.cg button{aspect-ratio:1;border:0;border-radius:50%;background:none;color:var(--tx);font:inherit;font-size:15px;cursor:pointer}
.cg button.on{background:var(--pr);color:#fff;font-weight:600}
.cg button.td{color:var(--pr);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--pr)}
.cg.m{grid-template-columns:repeat(3,1fr)}.cg.m button{aspect-ratio:2/1;border-radius:14px}
.cft{display:flex;justify-content:space-between;margin-top:10px}
.cft button{border:0;background:none;color:var(--pr);font:inherit;font-weight:600;padding:8px 6px;cursor:pointer}
.q{animation:none!important}
.noanim *{animation:none!important;transition:none!important}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ph b{font-size:18px;font-weight:650;letter-spacing:-.01em}
.ph b:before{content:"";display:inline-block;width:4px;height:16px;border-radius:4px;background:linear-gradient(var(--pr),var(--p2));margin-right:10px;vertical-align:-2px}
.ph button{width:32px;height:32px;border-radius:50%;border:0;background:var(--inbg);color:var(--mu);font-size:13px;cursor:pointer}
.col{display:grid;grid-template-rows:1fr;opacity:1;transition:grid-template-rows .45s var(--e),opacity .35s ease}
.col>div{overflow:hidden;min-height:0}
.col.h{grid-template-rows:0fr;opacity:0}
.col.h>div{visibility:hidden;transition:visibility 0s .45s}
@keyframes fin{from{opacity:0;transform:translateY(8px)}}
.fin{animation:fin .4s var(--e)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pan.sk{animation:shake .4s}
.err{display:block;margin-top:8px}.err:empty{display:none}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--pr) 45%,transparent) transparent}
.chips{scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--pr) 40%,transparent);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--pr) 65%,transparent);background-clip:content-box}
.dd{display:flex;align-items:center;justify-content:space-between;text-align:left;gap:8px}
.dd span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd i{flex:none;width:7px;height:7px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg) translateY(-2px);margin-right:4px}
.ddb{position:fixed;inset:0;z-index:70}
.ddl{position:fixed;z-index:71;overflow:auto;padding:6px;border-radius:18px;background:var(--gl2);animation:ddp .28s var(--e);transform-origin:top}
@keyframes ddp{from{opacity:0;transform:scale(.94) translateY(-6px)}}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:12px;text-align:left;font-size:15px;color:var(--tx);transition:background .2s}
.opt span{font-size:18px;width:24px;text-align:center}
.opt b{font-weight:500}
.opt:hover{background:var(--inbg)}
.opt.on{background:color-mix(in srgb,var(--pr) 14%,transparent);color:var(--pr)}
.bigr{position:relative;aspect-ratio:1;width:100%;max-width:240px;margin:6px auto 4px;border-radius:50%!important}
.bigr svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.bigr circle+circle{animation:ring 1.2s var(--e) both}
.bigr .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;padding:14%}
.bigr b{font-size:clamp(30px,10vw,44px);letter-spacing:-.03em;line-height:1.05}
.stt{font-weight:700;font-size:16px}
.bigr b.sm{font-size:clamp(20px,6.6vw,30px)}
.cap{display:block;text-align:center;margin-bottom:14px}
.bdg{font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--inbg);color:var(--mu);white-space:nowrap}
.bdg.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.bdg.nx{background:var(--pr);color:#fff}
.bdg.wa{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.cat{display:inline-flex;align-items:center;gap:6px;cursor:default}
.nrow{display:flex;gap:10px;align-items:flex-start}.nrow .in{margin:0}.nrow .ico{width:46px;height:46px;font-size:22px}
.eg{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.eg button{aspect-ratio:1;border-radius:12px;font-size:20px;background:var(--inbg)}
.eg button.on{background:color-mix(in srgb,var(--pr) 20%,transparent);box-shadow:inset 0 0 0 2px var(--pr)}
</style>
</head>
<body>
<div id="app"></div>
<button class="gear g" onclick="settings()" aria-label="Configuración"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
<nav><div class="g bar">
<button class="t" data-t="home" onclick="tab('home')" aria-label="Inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Inicio</button>

</div></nav>
<div id="dt"></div><div id="sh"></div><div id="cal"></div><input type="file" id="imp" accept=".json,application/json" hidden onchange="imp(this)">
<script>
const MN=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MF=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const CAT={esencial:[["Mercado","🛒"],["Arriendo","🏠"],["Servicios","💡"],["Gasolina","⛽"],["Transporte","🚌"],["Salud","💊"],["Deudas","💳"]],gusto:[["Salidas","🍽️"],["Cuidado personal","💅"],["Ropa","👕"],["Ocio","🎬"],["Otros","✨"]],ing:[["Sueldo","💼"],["Ventas","🏷️"],["Arriendo","🏠"],["Otros","➕"]],aho:[["Fondo de ahorro","🐷"]]};
const GN={esencial:"Esenciales",gusto:"Gustos",aho:"Ahorro"};
const TG={esencial:50,gusto:30,aho:20};
let PAL=["#f97316","#fb923c","#fdba74","#ea580c","#fed7aa","#c2410c","#f59e0b","#ffedd5","#9a3412","#fcd34d"];
const $=s=>document.querySelector(s);
const CURS={COP:["Peso colombiano","es-CO"],USD:["Dólar estadounidense","en-US"],EUR:["Euro","es-ES"],MXN:["Peso mexicano","es-MX"],ARS:["Peso argentino","es-AR"],PEN:["Sol peruano","es-PE"],CLP:["Peso chileno","es-CL"],BRL:["Real brasileño","pt-BR"],GBP:["Libra esterlina","en-GB"]};
let CFG={c:"#f97316",cur:"COP",th:"auto",an:true,yr:0,yt:"ea",tg:{esencial:50,gusto:30,aho:20}};
try{Object.assign(CFG,JSON.parse(localStorage.getItem("presu_cfg")||"{}"))}catch(e){}
const saveCfg=()=>{try{localStorage.setItem("presu_cfg",JSON.stringify(CFG))}catch(e){}};
const saveCat=()=>{try{localStorage.setItem("presu_cat",JSON.stringify(CAT))}catch(e){}};
try{const x=JSON.parse(localStorage.getItem("presu_cat")||"null");if(x&&x.esencial&&x.gusto&&x.aho&&x.ing)Object.assign(CAT,x)}catch(e){}
const LOC=()=>(CURS[CFG.cur]||CURS.COP)[1];
let c0,c2;
const mk=()=>{const o={style:"currency",currency:CFG.cur in CURS?CFG.cur:"COP"};c0=new Intl.NumberFormat(LOC(),{...o,maximumFractionDigits:0});c2=new Intl.NumberFormat(LOC(),{...o,minimumFractionDigits:2,maximumFractionDigits:2})};
const fmt=n=>(Math.abs(n-Math.round(n))>.004?c2:c0).format(n);
const SEP=()=>{const p=new Intl.NumberFormat(LOC()).formatToParts(1234.5);return{g:(p.find(x=>x.type==="group")||{value:"."}).value,d:(p.find(x=>x.type==="decimal")||{value:","}).value}};
const gp=(i,g)=>i.replace(/\B(?=(\d{3})+(?!\d))/g,g);
const mf=(el,ev)=>{const{g,d}=SEP(),t=el.value,del=ev&&/^delete/.test(ev.inputType||""),hd=t.includes(d)||(!del&&/[.,]$/.test(t)),p=t.includes(d)?t.indexOf(d):t.length-1;
const i=(hd?t.slice(0,p):t).replace(/\D/g,"").replace(/^0+(?=\d)/,""),c=hd?t.slice(p+1).replace(/\D/g,"").slice(0,2):"";
el.value=(i?gp(i,g):hd?"0":"")+(hd?d+c:"")};

<small class="neg err" id="fe"></small><button class="save" onclick="add()">Guardar</button></div>`;
$("#sh").classList.add("on")};

[["ing","","Sueldo","Pago mensual","02",2400000],["ing","","Ventas","Ventas",10,600000],["gas","esencial","Arriendo","Arriendo","03",700000],["gas","esencial","Mercado","Mercado","05",380000+i*20000],["gas","esencial","Gasolina","Gasolina moto","07",90000],["gas","esencial","Servicios","Servicios","12",160000],["gas","gusto","Salidas","Cena","14",150000+i*30000],["gas","gusto","Cuidado personal","Peluquería","18",80000],["aho","","Fondo de ahorro","Ahorro","20",200000]].forEach((r,j)=>D.push({id:String(Date.now()+i*20+j),t:r[0],g:r[1],c:r[2],n:r[3],d:p+String(r[4]).padStart(2,"0"),v:r[5]}))});save();go()};

const imp=i=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),a=Array.isArray(j)?j:j.datos;if(!Array.isArray(a))throw 0;const ids=new Set(D.map(x=>x.id)),nw=a.filter(x=>x&&x.id&&["ing","gas","aho"].includes(x.t)&&x.d&&x.v>0&&!ids.has(String(x.id))).map(x=>({id:String(x.id),t:x.t,g:x.t==="gas"?(x.g==="gusto"?"gusto":"esencial"):"",c:String(x.c||""),n:String(x.n||""),d:String(x.d),v:+x.v}));D.push(...nw);save();if(Array.isArray(j.deudas)){const di=new Set(DB.map(x=>x.id));DB.push(...j.deudas.filter(x=>x&&x.id&&x.n&&Array.isArray(x.p)&&!di.has(x.id)));saveDB()}if(j.cats&&j.cats.esencial&&j.cats.gusto&&j.cats.aho&&j.cats.ing){Object.assign(CAT,j.cats);saveCat()}go();msg("Se importaron "+nw.length+" movimientos.")}catch(e){msg("El archivo no es una copia válida.")}i.value=""};r.readAsText(f)};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(!D.length)idb("readonly").then(s=>{try{const a=JSON.parse(s||"[]");if(Array.isArray(a)&&a.length&&!D.length){D=a;save();go()}}catch(e){}});
applyCfg();$("#app").classList.add("a");go();setTimeout(()=>$("#app").classList.remove("a"),900);
